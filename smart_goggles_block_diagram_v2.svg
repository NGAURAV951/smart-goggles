<svg viewBox="0 0 820 520" width="820" height="520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="820" height="520" fill="#ffffff"/>
  <text x="410" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Smart Goggles: System Block Diagram</text>

  <!-- ESP32 center -->
  <rect x="315" y="220" width="190" height="80" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/>
  <text x="410" y="255" text-anchor="middle" font-size="16" font-weight="bold" fill="#085041">ESP32</text>
  <text x="410" y="275" text-anchor="middle" font-size="12" fill="#0F6E56">Main controller</text>
  <text x="410" y="291" text-anchor="middle" font-size="12" fill="#0F6E56">(authentication-gated logic)</text>

  <!-- Fingerprint sensor -->
  <rect x="40" y="90" width="180" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="130" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#0C447C">Fingerprint Sensor</text>
  <text x="130" y="134" text-anchor="middle" font-size="11" fill="#185FA5">UART (GPIO26/27)</text>
  <text x="130" y="148" text-anchor="middle" font-size="11" fill="#185FA5">unlocks device</text>

  <!-- GPS module -->
  <rect x="40" y="228" width="180" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="130" y="254" text-anchor="middle" font-size="14" font-weight="bold" fill="#0C447C">GPS Module</text>
  <text x="130" y="272" text-anchor="middle" font-size="11" fill="#185FA5">UART (GPIO16/17)</text>
  <text x="130" y="286" text-anchor="middle" font-size="11" fill="#185FA5">lat / long / time</text>

  <!-- Touch sensor -->
  <rect x="40" y="366" width="180" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="130" y="392" text-anchor="middle" font-size="14" font-weight="bold" fill="#0C447C">Touch Sensor</text>
  <text x="130" y="410" text-anchor="middle" font-size="11" fill="#185FA5">GPIO4</text>
  <text x="130" y="424" text-anchor="middle" font-size="11" fill="#185FA5">switches screen view</text>

  <!-- MPU6050 -->
  <rect x="600" y="90" width="180" height="64" rx="8" fill="#FDEDE3" stroke="#B5541C" stroke-width="1.5"/>
  <text x="690" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#8C3E13">MPU6050</text>
  <text x="690" y="134" text-anchor="middle" font-size="11" fill="#B5541C">I2C (GPIO21/22)</text>
  <text x="690" y="148" text-anchor="middle" font-size="11" fill="#B5541C">accel + gyro</text>

  <!-- OLED display -->
  <rect x="600" y="228" width="180" height="64" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/>
  <text x="690" y="254" text-anchor="middle" font-size="14" font-weight="bold" fill="#633806">OLED Display</text>
  <text x="690" y="272" text-anchor="middle" font-size="11" fill="#854F0B">I2C (GPIO21/22)</text>
  <text x="690" y="286" text-anchor="middle" font-size="11" fill="#854F0B">shows status/sensor screens</text>

  <!-- Battery -->
  <rect x="600" y="366" width="180" height="64" rx="8" fill="#FDEDE3" stroke="#B5541C" stroke-width="1.5"/>
  <text x="690" y="392" text-anchor="middle" font-size="14" font-weight="bold" fill="#8C3E13">Battery</text>
  <text x="690" y="410" text-anchor="middle" font-size="11" fill="#B5541C">Analog (GPIO34)</text>
  <text x="690" y="424" text-anchor="middle" font-size="11" fill="#B5541C">voltage level</text>

  <!-- WiFi cloud -->
  <ellipse cx="410" cy="440" rx="110" ry="42" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="410" y="435" text-anchor="middle" font-size="14" font-weight="bold" fill="#3C3489">WiFi</text>
  <text x="410" y="453" text-anchor="middle" font-size="11" fill="#534AB7">network connectivity</text>

  <!-- Arrows -->
  <line x1="220" y1="122" x2="313" y2="235" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="220" y1="260" x2="313" y2="255" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="220" y1="398" x2="313" y2="285" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="505" y1="235" x2="598" y2="122" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="505" y1="255" x2="598" y2="260" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="505" y1="285" x2="598" y2="398" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="410" y1="300" x2="410" y2="398" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
